# --- Animation editor, number pad, help, tips ---
anim_help=Toque nas imagens da lista para adicioná-las como quadros. Arraste um quadro para mudar a ordem, ✕ remove o quadro, toque em um quadro para vê-lo. "Tempo do quadro" define por quanto tempo cada quadro é mostrado (milissegundos). Use a animação nos blocos com setAnimation e o nome dela.
anim_empty=Nenhum quadro ainda.\nToque nas imagens abaixo para adicioná-las.
anim_prev=Quadro anterior
anim_next=Próximo quadro
anim_frame_time=Tempo do quadro (ms)
anim_add_frames=Imagens: toque para adicionar um quadro
anim_add_all=Adicionar todas
anim_save_q=Salvar esta animação antes de fechar?
ui_clear=Limpar
tut_params_intro=O bloco amarelo mostra o evento (%1$s) e suas entradas. "%2$s" é este elemento: pressione e segure e arraste para qualquer campo para usá-lo.
tut_numpad_intro=Campos de número abrem um teclado numérico: toque nos dígitos, ⌫ apaga o último, C limpa tudo, depois OK.
tut_drag_body2=O bloco amarelo mostra as entradas deste evento. Segure %1$s (o corpo que bateu na rocha) e arraste para o primeiro círculo.
tut_drag_body2_coin=Segure %1$s no bloco amarelo (o corpo que tocou a moeda) e arraste para o primeiro círculo.
blk_browse=Procurar
blk_p_current=o elemento dono deste evento
blk_p_body2=o outro corpo da colisão
blk_p_body1=o primeiro corpo da colisão
blk_p_event=o evento de toque (posição, ponteiro…)
blk_p_drag=Segure e arraste uma cópia para qualquer campo.
ui_light_blur=Bordas de luz suaves (desfocadas)
ui_light_shadows=Corpos projetam sombras
ui_light_culling=Ignorar luzes fora da tela (mais rápido)
ui_light_diffuse=Luz difusa (mais suave, menos contraste)
ui_light_gamma=Correção de gama
ui_add_desc_boxBody=Um retângulo com física. Jogadores, paredes, plataformas.
ui_add_desc_circleBody=Um corpo redondo: bolas, rodas, moedas.
ui_add_desc_textItem=Mostrar texto: pontuação, títulos, mensagens.
ui_add_desc_joystickItem=Joystick na tela para controlar o jogador.
ui_add_desc_progressBar=Barras de vida, barras de carregamento, temporizadores.
ui_add_desc_customBody=Corpo com formato de colisão personalizado (polígono).
ui_add_desc_particleEffect=Efeitos de fogo, fumaça, faíscas, chuva.
ui_add_desc_camera=Controla qual parte do mundo fica visível.
ui_add_desc_tiledMap=Carregar uma fase feita com o Tiled (.tmx).
ui_add_desc_pointLight=Luz que brilha em todas as direções.
ui_add_desc_directionalLight=Luz como a do sol, vinda de uma direção.
ui_add_desc_coneLight=Cone de lanterna / holofote.
ui_ev_desc_OnCreate=Roda uma vez quando o cenário começa.
ui_ev_desc_OnStep=Roda a cada quadro (cerca de 60 vezes por segundo).
ui_ev_desc_OnPause=Quando o jogo é pausado / o app vai para segundo plano.
ui_ev_desc_OnResume=Quando o jogo volta.
ui_ev_desc_onCollisionStart=Quando dois corpos quaisquer começam a se tocar (body1, body2).
ui_ev_desc_onCollisionEnd=Quando dois corpos param de se tocar.
ui_ev_desc_onClick=Quando este elemento é tocado.
ui_ev_desc_OnBodyCreated=Quando este elemento é criado.
ui_ev_desc_OnBodyUpdate=A cada quadro, para este elemento.
ui_ev_desc_onTouchStart=Quando um dedo começa a tocá-lo.
ui_ev_desc_onTouchEnd=Quando o dedo é levantado.
ui_ev_desc_onBodyCollided=Quando ele bate em outro corpo (body2).
ui_ev_desc_onBodyCollideEnd=Quando ele para de tocar outro corpo.
ui_tip_name=Nome único do elemento. Usado nos blocos e no código para encontrá-lo.
ui_tip_type=DYNAMIC: se move e cai com a gravidade (jogadores, bolas).\nSTATIC: nunca se move (chão, paredes).\nKINAMATIC: se move só por código, não é afetado pela gravidade (plataformas móveis).\nUI: fica fixo na tela (botões, pontuação).
ui_tip_lock=Elementos bloqueados não podem ser movidos pelo toque no editor.
ui_tip_Script=Qual script de corpo (código) controla este elemento.
ui_tip_parent=Prende este elemento a outro; ele segue o pai.
ui_tip_x=Posição horizontal no mundo.
ui_tip_y=Posição vertical no mundo.
ui_tip_z=Ordem de desenho: valores maiores são desenhados por cima.
ui_tip_rotation=Ângulo em graus.
ui_tip_width=Largura do elemento.
ui_tip_height=Altura do elemento.
ui_tip_radius=Raio do círculo.
ui_tip_density=O quanto o corpo é pesado. Maior = mais pesado.
ui_tip_friction=O quanto ele desliza. 0 = gelo, 1 = borracha.
ui_tip_restitution=Quique. 0 = sem quique, 1 = quique total.
ui_tip_Gravity_Scale=Multiplicador da gravidade neste corpo. 0 = flutua.
ui_tip_Fixed_Rotation=Impede o corpo de girar (bom para jogadores).
ui_tip_Bullet=Colisão melhor para objetos muito rápidos.
ui_tip_isSensor=Detecta colisões mas não bloqueia (gatilhos, moedas).
ui_tip_Active=Corpos inativos não participam da física.
ui_tip_Visible=Mostrar ou ocultar o elemento.
ui_tip_image=Imagem mostrada para este elemento (da pasta images).
ui_tip_Tint=Cor multiplicada sobre a imagem.
ui_tip_Collision=Elementos com os quais este NÃO deve colidir.
ui_tip_Points=Pontos do polígono de colisão personalizado.
ui_tip_Text=Texto a mostrar.
ui_tip_Font_Scale=Tamanho do texto.
ui_tip_tileX=Repetir a imagem na horizontal.
ui_tip_tileY=Repetir a imagem na vertical.
ui_tip_Zoom=Zoom da câmera. Menor = mais perto.
ui_tip_Duration=Duração do efeito em segundos.
ui_tip_Distance=Até onde a luz alcança.
ui_tip_rays=Qualidade da luz (mais raios = mais suave, mais lento).
ui_tip_Static_Light=Luzes estáticas são mais leves (não se movem).
ui_tip_attach_To=Prende a luz a um elemento para que ela o siga.
help_add_t=➕ Adicionar elementos
help_add_d=Toque no botão azul + e escolha um tipo (caixa, círculo, texto, joystick...).
help_tools_t=✋ Ferramentas
help_tools_d=Mão = selecionar e mover a câmera, depois mover, redimensionar e girar. O botão XY trava o arraste em um eixo.
help_props_t=⚙ Propriedades
help_props_d=Abra Propriedades na barra lateral para mudar nome, imagem, tipo (estático/dinâmico), física e mais. Campos de número abrem um teclado numérico.
help_events_t=⚡ Eventos
help_events_d=Selecione um elemento, abra Eventos (ex.: aoClicar) e arraste blocos para dentro para criar a lógica sem código.
help_blocks_t=🧩 Blocos
help_blocks_d=Segure um bloco na paleta e arraste para baixo de outro (ou só toque nele). Toque em um campo para digitar um valor ou colocar um bloco de valor nele; blocos de valor podem ficar um dentro do outro. Segure um bloco para ver as opções, (!) explica o bloco.
help_params_t=🔹 Parâmetros do evento
help_params_d=O primeiro bloco de um evento mostra seus parâmetros: current (este elemento), body2 (o que ele atingiu), event (o toque). Segure um e arraste uma cópia para qualquer campo.
help_numbers_t=🔢 Números e arquivos
help_numbers_d=Campos de número abrem um teclado (⌫ apaga, C limpa). Campos de imagens, sons, animações e cenários têm um botão Procurar que abre a pasta certa.
help_anims_t=🎞 Animações
help_anims_d=Em Arquivos, abra (ou crie) uma animação na pasta anims: toque nas imagens para adicionar quadros, arraste quadros para reordenar, defina o tempo do quadro e aperte play. Use com o bloco setAnimation.
help_joints_t=🔗 Joints (Junções)
help_joints_d=Joints (junções) conectam dois corpos fisicamente: rodas, portas, cordas...
help_vars_t=𝑥 Variáveis
help_vars_d=Crie variáveis como score ou lives e use-as nos blocos.
help_assets_t=🖼 Coleções
help_assets_d=Imagens gratuitas (CC0) que você pode adicionar ao seu projeto em Arquivos → Coleções.
help_play_t=▶ Jogar
help_play_d=O botão verde Jogar compila e roda seu jogo. Pressione Voltar para parar. Se falhar, toque em “Pedir à IA para corrigir”.
help_lessons_t=🎓 Lições
help_lessons_d=Na tela inicial, a aba Aprender tem lições passo a passo que criam jogos de verdade com você.
help_ai_t=✨ Assistente de IA
help_ai_d=Descreva o que você quer, ex.: “faça o jogador pular quando eu tocar”, e ele escreve o código ou explica os passos.


LoopDetails = Repetir a animação
lockDetails = Travar o item para evitar redimensionamento e movimento não intencionais
ActiveDetails = Se o item estiver desativado, ele para de responder à física
softDetails = Determina se a luz é suave ou não. A suavidade faz a luz passar através de outros elementos.
visibleDetails = determina se o elemento é visível ou não
bulletDetails = Se o item é um projétil, ele responderá à física mais rápido e periodicamente (esta característica não deve ser ativada sempre)
fixedRotationDetails = torna a rotação do item fixa no jogo.
isSensorDetails = O elemento sensor apenas detecta outros objetos, mas não é afetado fisicamente por eles.
shapeDetails = determina o tipo de forma (retangular/circular/personalizada)
lightTypeDetails = determina o tipo de luz
fontDetails = selecionar a fonte do texto
textColorDetails = selecionar a cor do texto
tintDetails = funciona como um filtro de cor para os elementos.
collisionDetails = Os itens que você especificar aqui não colidirão com este item e o atravessarão.
attachToDetails = adiciona a luz a um elemento, para que ela sempre o siga.
parentDetails = selecionar o elemento pai deste elemento.
PointsDetails = especificar os pontos do colisor personalizado.

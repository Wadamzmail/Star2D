# --- racing v2, sizes ---
tut_set_w=Elementos novos são pequenos. Defina a largura como %1$s.
tut_set_h=Defina a altura como %1$s.
tut_bounce_zero=Defina restitution (quique) como %1$s para o herói cair sem quicar.
tut_road_info=Agora a estrada. road1 e road2 compartilham os mesmos eventos (Script road), então os blocos valem para as duas partes.
tut_road_created=Toque em OnBodyCreated: roda uma vez para cada parte da estrada.
tut_road_speed=Defina a velocidade como %1$s: a estrada desce e o carro parece avançar.
tut_road_update=Toque em OnBodyUpdate: quando uma parte sai por baixo, ela pula para cima da outra.
tut_road_limit=Digite %1$s no segundo círculo: o meio da parte está meia tela abaixo, fora de vista.
tut_moveby_inside=Arraste "%1$s" para dentro de "%2$s": move um elemento por uma distância.
tut_moveby_dx=Defina dx como %1$s (sem movimento lateral).
tut_moveby_dy=Defina dy como %1$s: duas partes para cima, logo acima da outra.
tut_rival_info=Os três carros rivais também compartilham eventos (Script: rival). Eles descem mais devagar que a estrada, como carros lentos que você ultrapassa.


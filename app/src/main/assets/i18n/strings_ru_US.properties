tpl_Paul_desc=Контроллер анимированного персонажа, демонстрирующий действия конечного автомата и спрайтовые анимации.
tpl_example1_title=Базовый 2D-старт
tpl_example1_tag=Старт
tpl_example1_desc=Чистая пустая сцена с 2D-камерой, физическим миром, гравитацией и соединениями — всё готово для работы.
tut_end_free=Урок закрыт. Проект ваш: продолжайте создавать!
tut_done_title=Урок пройден!
tut_done_msg=Отличная работа! Теперь этот проект ваш: меняйте его, добавляйте блоки и сделайте из него свою игру.
tut_end_title=Завершить урок?
tut_end_msg=Вы можете оставить проект и продолжить самостоятельно.
tut_end=Завершить урок
tut_pause_title=Приостановить урок?
tut_pause_msg=Во время паузы можно свободно пользоваться редактором. Нажмите «Продолжить урок» вверху, чтобы вернуться.
tut_pause=Пауза
tut_continue=Продолжить
tut_paused=Урок на паузе
tut_continue_lesson=Продолжить урок
tut_preparing=Готовим проект для урока… подождите немного.
tut_stop=Стоп
tut_auto=Автообъяснение
tut_next=Далее
tut_skip=Пропустить
tut_well_done=Отлично!
tut_var_add=Нажмите «Добавить переменную».
tut_var_name=Введите имя %1$s. Тип int (целое число) и значение 0 уже верные. Затем нажмите «Сохранить».
tut_first_title=Моя первая игра: Поймай звезду
tut_first_tag=Новичок · 10 мин
tut_first_desc=Освойте редактор: добавьте элемент, дайте ему картинку, используйте переменную и первые блоки. Нажимайте на звезду, чтобы набирать очки!
tut_flappy_title=Flappy Bird
tut_flappy_tag=Аркада · 15 мин
tut_flappy_desc=Нажимайте, чтобы лететь, и избегайте трубы! Гравитация, события касания, движущиеся препятствия и условия с вложенными блоками значений.
tut_racing_title=Гонки
tut_racing_tag=Гонки · 20 мин
tut_racing_desc=Управляйте джойстиком на движущейся дороге и объезжайте машины. Джойстик, бесконечная прокрутка, общие события и случайные позиции.
tut_shooter_title=Космический шутер
tut_shooter_tag=Шутер · 20 мин
tut_shooter_desc=Двигайте корабль пальцем, стреляйте лазерами и разбивайте камни. Копии, if / else, столкновения и позиция касания.
tut_plat_title=Платформер
tut_plat_tag=Платформер · 20 мин
tut_plat_desc=Ходите, прыгайте по ящикам и хватайте монету. Кнопки, начало / конец касания, следование камеры и столкновения.
tut_how=Нажимайте точно туда, куда указывает рука; всё остальное на паузе. ▶▶ «Автообъяснение» выполняет шаги за вас, «Пропустить» — только текущий. Нажмите «Назад», чтобы приостановить урок.
tut_open_vars=Откройте «Переменные». Переменная — это коробка, которая хранит значение, например счёт.
tut_set_x=Установите x на %1$s (пиксели от левого края экрана).
tut_set_y=Установите y на %1$s (пиксели от нижнего края).
tut_add_if=Добавьте блок "%1$s": блоки внутри него выполняются, только когда условие истинно.
tut_cond_less=Нажмите на условие и выберите %1$s в разделе «Операторы».
tut_cond_axis=Нажмите на первый кружок и выберите %1$s в разделе «Элементы».
tut_cond_current=Нажмите на маленький кружок и выберите %1$s (этот элемент).
tut_cond_limit=Нажмите на второй кружок и введите %1$s: теперь это значит «этот элемент ушёл за экран».
tut_goto_inside=Перетащите "%1$s" внутрь "%2$s" (проём под условием).
tut_goto_x_random=Нажмите на x и выберите %1$s в разделе «Математика»: каждый раз новое место.
tut_random_from=Введите %1$s в первый кружок.
tut_random_to=Введите %1$s во второй кружок.
tut_goto_y_top=Установите y на %1$s: выше верхнего края экрана.
tut_goto_x_right=Установите x на %1$s: обратно к правому краю.
tut_goto_y_random=Нажмите на y и выберите %1$s в разделе «Математика»: каждый раз новая высота.
tut_open_scene1=Выберите %1$s: повторное открытие той же сцены перезапускает игру.
tut_add_box_star=Выберите «Прямоугольное тело»: элемент, который может показывать любую картинку.
tut_type_static=Наша звезда не должна падать. Нажмите «Тип» и выберите STATIC: она останется там, где вы её поставили.
tut_event_click_star=Нажмите «При клике»: эти блоки выполняются, когда игрок нажимает на звезду.
tut_blocks_intro=Это редактор блоков. Жёлтый блок — начало; блоки под ним выполняются один за другим. Долгое нажатие на блок открывает его параметры, (!) объясняет любой блок.
tut_drag_first=Удерживайте "%1$s" мгновение и перетащите под жёлтый блок (или просто нажмите на него).
tut_field_var=Нажмите на поле переменной и выберите %1$s. «на 1» означает +1 очко.
tut_add_toast=Добавьте "%1$s": он показывает короткое сообщение на экране.
tut_toast_score=Нажмите на его поле значения и выберите %1$s.
tut_add_goto_star=Добавьте "%1$s": он перемещает элемент. "current" означает этот элемент — звезду.
tut_x_random=Нажмите на поле x и выберите блок значения %1$s в разделе «Математика».
tut_y_random=То же для y: нажмите на него и выберите %1$s.
tut_play_first=Играйте! Нажимайте на звезду как можно быстрее. Нажмите «Назад», чтобы вернуться в редактор.
tut_first_end=Вы сделали свою первую игру! 🎉 Попробуйте: измените случайные числа, добавьте playSound в «При клике» или добавьте вторую звезду.
tut_add_box_bird=Выберите «Прямоугольное тело» для нашей птицы.
tut_fixed_rot=Включите «Фиксированное вращение», чтобы птица никогда не крутилась.
tut_gravity_info=Гравитация тянет тела вниз. Сделаем её сильнее: игра станет быстрее и веселее.
tut_scene_oncreate=Нажмите onCreate в «Событиях сцены»: он выполняется один раз при запуске игры.
tut_add_gravity=Добавьте "%1$s" под жёлтый блок.
tut_gravity_val=Нажмите на силу и введите %1$s.
tut_flap_info=Теперь взмах: небо закрывает весь экран, поэтому касание неба заставляет птицу прыгнуть.
tut_sky_touch=Нажмите «При начале касания»: выполняется, когда палец касается неба.
tut_jump_bird=Сейчас прыгает "current" (небо!). Нажмите на поле элемента и выберите %1$s.
tut_jump_power=Установите силу на %1$s.
tut_pipe_info=Труба должна двигаться влево и снова и снова возвращаться справа.
tut_pipe_created=Нажмите «При создании тела»: выполняется один раз, когда появляется труба.
tut_velx_left=Установите скорость на %1$s (минус = влево, в пикселях в секунду).
tut_pipe_update=Теперь нажмите «При обновлении тела»: выполняется каждый кадр для трубы.
tut_hit_info=Последнее: когда птица врезается в трубу или землю, игра начинается заново.
tut_play_flappy=Играйте! Нажимайте на экран, чтобы пролететь над трубой. Нажмите «Назад», чтобы вернуться.
tut_flappy_end=Ваш Flappy Bird работает! 🎉 Идеи: переменная счёта, которая растёт в "if" трубы, вторая труба или звук взмаха.
tut_add_box_car=Выберите «Прямоугольное тело» для вашей машины.
tut_fixed_rot_car=Включите «Фиксированное вращение», чтобы машина ехала прямо.
tut_add_joystick=Теперь выберите «Элемент джойстика»: игрок управляет им.
tut_gravity_zero=Вид сверху — ничего не падает: введите %1$s.
tut_car_update=Нажмите «При обновлении тела»: каждый кадр машина следует за джойстиком.
tut_joy_field=Нажмите на поле джойстика и выберите %1$s.
tut_joy_speed=Установите скорость на %1$s.
tut_rival_created=Нажмите OnBodyCreated для машин-соперников.
tut_vely_down=Установите скорость на %1$s (минус = вниз).
tut_rival_update=Нажмите OnBodyUpdate: каждый кадр проверяем, не уехала ли машина вниз.
tut_play_racing=Играйте! Рулите джойстиком и объезжайте машины. «Назад» — вернуться.
tut_racing_end=Вжух! 🏁 Идеи: добавьте третий кусок дороги (тогда сдвиг 3840), считайте обогнанные машины в переменной или ускоряйтесь со временем.
tut_add_box_ship=Выберите «Прямоугольное тело» для корабля.
tut_fixed_rot_ship=Включите «Фиксированное вращение».
tut_gravity_space=В космосе нет гравитации: введите %1$s.
tut_scene_onstep=Нажмите onStep: выполняется каждый кадр, примерно 60 раз в секунду.
tut_add_if_touch=Добавьте "%1$s": его блоки выполняются, пока палец на экране.
tut_goto_ship=Установите элемент на %1$s.
tut_goto_touch=Нажмите на x и выберите %1$s в разделе «Ввод»: корабль следует за пальцем.
tut_goto_y_ship=Установите y на %1$s.
tut_fire_info=Огонь! Нажатие на красную кнопку копирует лазер и выстреливает его вверх.
tut_fire_click=Нажмите «При клике» у кнопки огня.
tut_add_spawn=Добавьте "%1$s": он создаёт копию элемента. Копия называется bullet (поле var).
tut_spawn_what=Нажмите на поле элемента и выберите %1$s.
tut_spawn_x=Нажмите на x и выберите %1$s в разделе «Элементы».
tut_spawn_x_ship=Нажмите на маленький кружок и выберите %1$s.
tut_spawn_y=Установите y на %1$s: чуть выше корабля.
tut_vely_bullet=Введите %1$s в поле элемента: это только что созданная копия.
tut_vely_up=Установите скорость на %1$s (вверх).
tut_rock_created=Нажмите «При создании тела» для камня.
tut_rock_update=Нажмите «При обновлении тела»: когда камень уходит за нижний край экрана, он возвращается сверху.
tut_rock_hit=Нажмите «При столкновении тела»: что-то ударило камень. Это была пуля или корабль?
tut_cond_named=Нажмите на условие и выберите %1$s в разделе «Логика».
tut_named_body2=Введите %1$s в первый кружок: тело, которое ударило камень.
tut_named_bullet=Введите %1$s во второй кружок.
tut_destroy_inside=Перетащите "%1$s" внутрь "%2$s".
tut_destroy_body2=Установите на %1$s: пуля исчезает.
tut_else_restart=Перетащите "%1$s" в проём else: всё остальное, что ударяет камень, — это корабль, поэтому игра перезапускается.
tut_play_shooter=Играйте! Ведите пальцем, чтобы двигаться, и нажимайте красную кнопку, чтобы стрелять. Нажмите «Назад», чтобы вернуться.
tut_shooter_end=Пиу-пиу! 🚀 Идеи: переменная счёта, больше камней (дублируйте камень) или звук взрыва.
tut_add_box_hero=Выберите «Прямоугольное тело» для нашего героя.
tut_fixed_rot_hero=Включите «Фиксированное вращение», чтобы герой не падал набок.
tut_add_camera=Добавьте "%1$s": камера следует за элементом.
tut_jump_click=Нажмите «При клике» у кнопки прыжка.
tut_cond_touches=Нажмите на условие и выберите %1$s в разделе «Логика»: прыгать, только стоя на земле.
tut_touch_hero=Введите %1$s в первый кружок.
tut_touch_ground=Введите %1$s во второй кружок.
tut_jump_inside=Перетащите "%1$s" внутрь "%2$s".
tut_coin_hit=Нажмите «При столкновении тела» у монеты.
tut_cond_named_hero=Нажмите на условие и выберите %1$s: это был герой?
tut_named_body2_coin=Введите %1$s в первый кружок: тело, которое коснулось монеты.
tut_named_hero=Введите %1$s во второй кружок.
tut_destroy_current=Установите на %1$s: монета исчезает.
tut_toast_inside=Перетащите "%1$s" тоже внутрь "%2$s".
tut_toast_text=Нажмите на его значение и выберите текстовый блок %1$s в разделе «Текст».
tut_toast_coin=Введите %1$s в кружок.
tut_play_plat=Играйте! Ходите стрелками и прыгайте кнопкой вверх. Хватайте монету! Нажмите «Назад», чтобы вернуться.
tut_plat_end=Отличный платформер! 🏆 Идеи: больше монет и ящиков (дублируйте их), счёт или анимации ходьбы.
tut_btn_start=Нажмите «При начале касания»: выполняется, пока палец нажимает кнопку %1$s.
tut_velx_hero=Установите элемент на %1$s.
tut_velx_speed=Установите скорость на %1$s.
tut_btn_end=Нажмите «При окончании касания»: когда палец отпускает кнопку, герой останавливается.
tut_velx_stop=Установите скорость на %1$s.
tut_close_panel=Закройте эту панель кнопкой ✕, чтобы снова увидеть сцену.
tut_add_open=Нажмите синюю кнопку +, чтобы добавить новый элемент.
tut_open_props=Откройте панель «Свойства»: здесь всё о выбранном элементе.
tut_rename=Нажмите на поле «Имя», введите %1$s и нажмите «Готово» ✓ на клавиатуре. Блоки используют это имя.
tut_image=Нажмите на поле «изображение», затем выберите %1$s.
tut_select_elem=Нажмите на %1$s, чтобы выбрать его.
tut_category=Откройте категорию палитры "%1$s".
tut_save_blocks=Сохраните блоки синей кнопкой сохранения.
tut_close_blocks=Вернитесь к сцене стрелкой «назад».
tut_play=Нажмите ▶, чтобы собрать и запустить игру. Первая сборка может занять несколько секунд.
tut_images_folder=Это папка images. Свои картинки можно добавить через «Импорт» (↑) или взять бесплатные из «Коллекций», но в этот раз я уже добавил изображения для этой игры.
tut_add_open_scene=Добавьте "%1$s".
tut_first_welcome=Добро пожаловать! Вы сделаете свою первую игру: появляется звезда, вы нажимаете на неё, получаете очко, и она прыгает в другое место. Я уже поставил для вас ночное небо.
tut_flappy_welcome=Сделаем Flappy Bird: нажимайте, чтобы взлетать, и не касайтесь трубы! Я уже поставил для вас небо, землю и трубу.
tut_add_jump=Добавьте "%1$s".
tut_add_velx=Добавьте "%1$s".
tut_bird_hit=Нажмите «При столкновении тела»: выполняется, когда птица врезается в другое тело.
tut_racing_welcome=Гонки! Вы ведёте красную машину джойстиком по движущейся дороге и объезжаете другие машины. Я разместил два куска дороги и три машины-соперника.
tut_add_joy_move=Добавьте "%1$s".
tut_add_vely=Добавьте "%1$s".
tut_car_hit=Нажмите onBodyCollided: срабатывает, когда соперник врезается в вашу машину.
tut_shooter_welcome=Космический шутер! Двигайте корабль пальцем и стреляйте по камням. Я уже поставил космос, камень, лазер (спрятан под экраном) и кнопку огня.
tut_plat_welcome=Платформер! Ходите стрелками, прыгайте по ящикам и хватайте монету. Я уже поставил холмы, землю, ящики, монету и кнопки.
tut_camera_hero=Выберите %1$s.
tut_jump_hero=Выберите %1$s.
tut_open_elements=Откройте список «Элементы»: все элементы сцены.
tut_open_events=Откройте панель «События». События — это моменты в игре: нажатие, столкновение, каждый кадр…
tut_open_files=Откройте «Файлы»: здесь хранятся ваши изображения, звуки и скрипты.
